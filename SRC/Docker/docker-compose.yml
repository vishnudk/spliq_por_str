version: "3.8"

services:
  # app_ui:
  #   build:
  #     context: ../   # Path to your Angular project
  #     dockerfile: Dockerfile
  #   platform: linux/amd64
  #   ports:
  #     - "4200:80"   # Browser → container
  #   networks:
  #     - app-network
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    networks:
      - app-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.0
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started
    ports:
      - "8200:8200"
    networks:
      - app-network
    command: >
      apm-server -e
      -E output.elasticsearch.hosts=["http://elasticsearch:9200"]
      -E setup.kibana.host="http://kibana:5601"
      -E apm-server.host="0.0.0.0:8200"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.0
    ports:
      - "5044:5044"
      - "5000:5000"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    networks:
      - app-network

  # user db and user mgr
  user_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_database
    expose:
      - "3306"
    volumes:
      - user_db_data:/var/lib/mysql
    networks:
      - user-network

  user_mgr:
    build:
      context: ../BL/user_mgr
      dockerfile: Dockerfile
    environment:
      DB_NAME: user_database
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: user_db
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../BL/user_mgr:/app
    depends_on:
      - user_db
    ports:
      - "8000:8000"
    networks:
      - user-network
      - app-network

  # group db and group mgr
  group_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: group_database
    expose:
      - "3306"
    volumes:
      - group_db_data:/var/lib/mysql
    networks:
      - group-network

  group_mgr:
    build:
      context: ../BL/group_mgr
      dockerfile: Dockerfile
    environment:
      DB_NAME: group_database
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: group_db
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - ../BL/group_mgr:/app
    depends_on:
      - group_db
    ports:
      - "8001:8001"
    networks:
      - group-network
      - app-network

  # expense db and expense mgr
  expense_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expense_database
    expose:
      - "3306"
    volumes:
      - expense_db_data:/var/lib/mysql
    networks:
      - expense-network

  expense_mgr:
    build:
      context: ../BL/expense_mgr
      dockerfile: Dockerfile
    environment:
      DB_NAME: expense_database
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: expense_db
    command: python manage.py runserver 0.0.0.0:8002
    volumes:
      - ../BL/expense_mgr:/app
    depends_on:
      - expense_db
    ports:
      - "8002:8002"
    networks:
      - expense-network
      - app-network

  nginx_server:
    build:
      context: ../Infra
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ../Infra/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ../Infra/nginx/conf/conf.d:/etc/nginx/conf.d

volumes:
  user_db_data:
  group_db_data:
  expense_db_data:

networks:
  app-network:
  user-network:
  group-network:
  expense-network:
